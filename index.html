    <title>ADP</title>
    <style>
        body {
            background-color: #000; /* Qora fon */
            color: #0f0; /* Yashil matn (Terminal uslubi) */

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
        }
        .container {
            border: 1px solid #0f0;

        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
    </style>
